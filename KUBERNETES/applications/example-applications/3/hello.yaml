apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-cm
data:
  hello.html: |
    "<h1>HELLO</h1>"
  index.html: |
    "<h1>Welcome to myservice</h1>"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf-cm
data:
  nginx.conf: |
    user  nginx;
    worker_processes  1;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;
    events {
        worker_connections  1024;
    }

    http {
        sendfile        on;
        server {
          listen       80;
          server_name  localhost;

          location / {
              root   /usr/share/nginx/html;
              index  index.html index.htm;
          }

          location /hello {
              root   /usr/share/nginx/html;
              index  index.html index.htm;
            }

          error_page 404 /404.html;
          error_page   500 502 503 504  /50x.html;
          location = /50x.html {
              root   /usr/share/nginx/html;
          }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy-hello
  labels:
    app: nginx-deploy-hello
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-hello
  template:
    metadata:
      labels:
        app: nginx-hello
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: "/usr/share/nginx/html/"
        - name: hello
          mountPath: "/usr/share/nginx/html/hello/"
        - name: config
          mountPath: "/etc/nginx/"
      volumes:
      - name: html
        configMap:
          name: nginx-cm
          items:
            - key: index.html
              path: index.html
      - name: hello
        configMap:
          name: nginx-cm
          items:
            - key: hello.html
              path: index.html
      - name: config
        configMap:
          name: nginx-conf-cm

---

apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-hello
spec:
  type: NodePort
  selector:
    app: nginx-hello
  ports:
  - port: 80
    protocol: TCP
    targetPort: 80