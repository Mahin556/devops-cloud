{{- if .Values.frontendservice.enabled -}}
{{- $name := "frontendservice" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "01-application.fullname" . }}-{{ $name }}
  labels:
    {{- include "01-application.metadataLabels" . | nindent 4 }}
    {{- include "01-application.selectorLabels" (list . $name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
      {{- include "01-application.selectorLabels" (list . $name) | nindent 6 }}
  ports:
  - name: http
    port: 80
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "01-application.fullname" . }}-{{ $name }}-loadbalancer
  labels:
    {{- include "01-application.metadataLabels" . | nindent 4 }}
    {{- include "01-application.selectorLabels" (list . $name) | nindent 4 }}
spec:
  type: LoadBalancer
  selector:
      {{- include "01-application.selectorLabels" (list . $name) | nindent 6 }}
  ports:
  - name: http
    port: 80
    targetPort: 8080
{{- end -}}