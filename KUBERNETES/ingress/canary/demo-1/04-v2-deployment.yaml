apiVersion: apps/v1
kind: Deployment
metadata:
  name: blogging-v2
  labels:
    app: blogging
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blogging
      version: v2
  template:
    metadata:
      labels:
        app: blogging
        version: v2
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
        command: ["/bin/sh","-c"]
        args:
        - |
          echo "<h1>VERSION 2</h1>" > /usr/share/nginx/html/index.html
          nginx -g 'daemon off;'
