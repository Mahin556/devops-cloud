apiVersion: apps/v1
kind: Deployment
metadata:
  name: login-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: login-app
  template:
    metadata:
      labels:
        app: login-app
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        command: 
          - /bin/sh
          - -c
          - "echo 'welcome to my login app!' > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
        volumeMounts:
        - name: nginx-config-volume
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf  # Ensure this matches the filename in the ConfigMap
        - name: index-volume
          mountPath: /usr/share/nginx/html/welcome/index.html
          subPath: index.html  # Ensure this matches the filename in the ConfigMap
      volumes:
      - name: nginx-config-volume
        configMap:
          name: login-app-config
          items:
            - key: nginx.conf
              path: nginx.conf
      - name: index-volume
        configMap:
          name: login-app-config
          items:
            - key: index.html
              path: index.html

---

