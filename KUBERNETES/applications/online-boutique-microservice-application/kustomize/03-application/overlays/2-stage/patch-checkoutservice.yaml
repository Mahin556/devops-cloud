apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
spec:
  template:
    spec:
      containers:
        - name: checkoutservice
          env:
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "myapp-productcatalogservice-stage:3550"
          - name: SHIPPING_SERVICE_ADDR
            value: "myapp-shippingservice-stage:50051"
          - name: PAYMENT_SERVICE_ADDR
            value: "myapp-paymentservice-stage:50051"
          - name: EMAIL_SERVICE_ADDR
            value: "myapp-emailservice-stage:5000"
          - name: CURRENCY_SERVICE_ADDR
            value: "myapp-currencyservice-stage:7000"
          - name: CART_SERVICE_ADDR
            value: "myapp-cartservice-stage:7070"