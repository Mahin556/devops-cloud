apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deploy-green
spec:
  replicas: 1
  selector:
    matchLabels:
      run: nginx-green
  template:
    metadata:
      labels:
        run: nginx-green
    spec:
      volumes:
      - name: webdata
        emptyDir: {}
      initContainers:
      - name: web-content
        image: busybox
        volumeMounts:
        - name: webdata
          mountPath: "/webdata"
        command: ["/bin/sh", "-c", "echo '<h1>I am <font color=GREEN>GREEN</font></h1>' > /webdata/index.html"]
      containers:
      - image: nginx
        name: nginx
        volumeMounts:
        - name: webdata
          mountPath: "/usr/share/nginx/html"
          
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc-green
spec:
  type: NodePort
  selector:
    run: nginx-green
  ports:
  - port: 80
    targetPort: 80