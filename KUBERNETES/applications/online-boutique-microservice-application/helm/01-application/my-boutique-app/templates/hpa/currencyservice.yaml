{{- if .Values.currencyservice.enabled -}}
{{- if .Values.currencyservice.autoscaling.enabled -}}
{{- $name := "currencyservice" -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "01-application.fullname" . }}-{{ $name }}-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "01-application.fullname" . }}-{{ $name }}

  minReplicas: {{ .Values.currencyservice.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.currencyservice.autoscaling.maxReplicas }}

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30 #default is 0 seconds
      policies:
        - type: Pods
          value: 1
          periodSeconds: 10

    scaleDown:
      stabilizationWindowSeconds: 30 #default is 300 seconds
      policies:
        - type: Pods
          value: 1
          periodSeconds: 20

  metrics:
    {{- if .Values.currencyservice.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.currencyservice.autoscaling.targetCPUUtilizationPercentage }}
    {{ end }}

    {{ if .Values.currencyservice.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.currencyservice.autoscaling.targetMemoryUtilizationPercentage }}
    {{ end }}
{{- end -}}
{{- end -}}