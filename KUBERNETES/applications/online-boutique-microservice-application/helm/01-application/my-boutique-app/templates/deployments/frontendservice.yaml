{{- if .Values.frontendservice.enabled -}}
{{- $name := "frontendservice" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "01-application.fullname" . }}-{{ $name }}
  labels:
    {{- include "01-application.metadataLabels" . | nindent 4 }}
    {{- include "01-application.selectorLabels" (list . $name) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "01-application.selectorLabels" (list . $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "01-application.metadataLabels" . | nindent 8 }}
        {{- include "01-application.selectorLabels" (list . $name) | nindent 8 }}
    spec:
      {{- $svc := index .Values $name }}
      {{- if not $svc.autoscaling.enabled }}
      replicas: {{ $svc.replicaCount }}
      {{- end }}
      serviceAccountName: {{ include "01-application.fullname" . }}-{{ $name }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: mahinraza556/frontend
          imagePullPolicy: IfNotPresent
          ports:
          - containerPort: 8080
          readinessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-readiness-probe"
          livenessProbe:
            initialDelaySeconds: 10
            httpGet:
              path: "/_healthz"
              port: 8080
              httpHeaders:
              - name: "Cookie"
                value: "shop_session-id=x-liveness-probe"
          env:
          - name: PORT
            value: "8080"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: PRODUCT_CATALOG_SERVICE_ADDR
          - name: CURRENCY_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: CURRENCY_SERVICE_ADDR
          - name: CART_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: CART_SERVICE_ADDR
          - name: RECOMMENDATION_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: RECOMMENDATION_SERVICE_ADDR
          - name: SHIPPING_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: SHIPPING_SERVICE_ADDR
          - name: CHECKOUT_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: CHECKOUT_SERVICE_ADDR
          - name: AD_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: AD_SERVICE_ADDR
          - name: SHOPPING_ASSISTANT_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: SHOPPING_ASSISTANT_SERVICE_ADDR
          # # ENV_PLATFORM: One of: local, gcp, aws, azure, onprem, alibaba
          # # When not set, defaults to "local" unless running in GKE, otherwies auto-sets to gcp
          # - name: ENV_PLATFORM
          #   value: "aws"
          - name: ENABLE_PROFILER
            value: "0"
          # - name: CYMBAL_BRANDING
          #   value: "true"
          # - name: ENABLE_ASSISTANT
          #   value: "true"
          # - name: FRONTEND_MESSAGE
          #   value: "Replace this with a message you want to display on all pages."
          # As part of an optional Google Cloud demo, you can run an optional microservice called the "packaging service".
          # - name: PACKAGING_SERVICE_URL
          #   value: "" # This value would look like "http://123.123.123"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end -}}