apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkoutservice
spec:
  template:
    spec:
      containers:
        - name: checkoutservice
          env:
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            value: "myapp-productcatalogservice-prod:3550"
          - name: SHIPPING_SERVICE_ADDR
            value: "myapp-shippingservice-prod:50051"
          - name: PAYMENT_SERVICE_ADDR
            value: "myapp-paymentservice-prod:50051"
          - name: EMAIL_SERVICE_ADDR
            value: "myapp-emailservice-prod:5000"
          - name: CURRENCY_SERVICE_ADDR
            value: "myapp-currencyservice-prod:7000"
          - name: CART_SERVICE_ADDR
            value: "myapp-cartservice-prod:7070"