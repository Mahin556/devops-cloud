{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "01-application.fullname" . }}-httproute
  labels:
    {{- include "01-application.metadataLabels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
  {{- range .Values.httpRoute.parentRefs }}
  - name: {{ .name }}
    sectionName: {{ .sectionName }}
    kind: Gateway
  {{- end }}
  hostnames:
  {{- range .Values.httpRoute.hostnames }}
  - {{ . }}
  {{- end }}
  rules:
  - backendRefs:
    - name: {{ include "01-application.fullname" . }}-frontendservice
      port: 80
      weight: 1
{{- end -}}