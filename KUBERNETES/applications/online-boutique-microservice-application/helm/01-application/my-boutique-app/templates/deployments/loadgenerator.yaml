{{- if .Values.loadgenerator.enabled }}
{{- $name := "loadgenerator" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "01-application.fullname" . }}-{{ $name }}
  labels:
    {{- include "01-application.metadataLabels" . | nindent 4 }}
    {{- include "01-application.selectorLabels" (list . $name) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "01-application.selectorLabels" (list . $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "01-application.metadataLabels" . | nindent 8 }}
        {{- include "01-application.selectorLabels" (list . $name) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "01-application.fullname" . }}-{{ $name }}
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
      - command:
        - /bin/sh
        - -exc
        - |
          MAX_RETRIES=12
          RETRY_INTERVAL=10
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i: Pinging frontend: ${FRONTEND_ADDR}..."
            STATUSCODE=$(wget --server-response http://${FRONTEND_ADDR} 2>&1 | awk '/^  HTTP/{print $2}')
            if [ $STATUSCODE -eq 200 ]; then
                echo "Frontend is reachable."
                exit 0
            fi
            echo "Error: Could not reach frontend - Status code: ${STATUSCODE}"
            sleep $RETRY_INTERVAL
          done
          echo "Failed to reach frontend after $MAX_RETRIES attempts."
          exit 1
        name: frontend-check
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: busybox:1.38.0@sha256:dc2d74b28e4cf8984fa52af1f39bc7c3d9c73760b41a74d629f5d11b1ab28616
        env:
        - name: FRONTEND_ADDR
          valueFrom:
            configMapKeyRef:
              name: "{{ include "01-application.configmapName" . }}"
              key: FRONTEND_ADDR
      containers:
      - name: main
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: mahinraza556/loadgenerator
        imagePullPolicy: IfNotPresent
        env:
        - name: FRONTEND_ADDR
          valueFrom:
            configMapKeyRef:
              name: "{{ include "01-application.configmapName" . }}"
              key: FRONTEND_ADDR
        - name: USERS
          value: "10"
        - name: RATE
          value: "1"
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
{{- end }}