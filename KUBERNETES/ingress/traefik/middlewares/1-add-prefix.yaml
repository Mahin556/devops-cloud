---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nginx-add-prefix
spec:
  addPrefix:
    prefix: /hello

---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nginx.mahinraza.online`)
      kind: Rule
      services:
        - name: nginx-svc-blue
          port: 80
    - match: Host(`nginx-green.mahinraza.online`)
      kind: Rule
      middlewares:
        - name: nginx-add-prefix
      services:
        - name: nginx-svc-hello
          port: 80
  tls:
    secretName: wildcard-mahinraza-online

