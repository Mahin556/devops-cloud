# Job with Backoff Limit
# This Job will fail after retrying 3 times.

apiVersion: batch/v1
kind: Job
metadata:
  name: retry-job
spec:
  backoffLimit: 3
  template:
    spec:
      containers:
      - name: fail
        image: busybox
        command: ["sh", "-c", "exit 1"]   # Always fails
      restartPolicy: OnFailure