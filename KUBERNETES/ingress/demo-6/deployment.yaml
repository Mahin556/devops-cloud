apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deploy
  namespace: myapp-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp-container
        image: nginx:latest
        ports:
        - containerPort: 80