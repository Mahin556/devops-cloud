apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: nginx-basic-auth
spec:
  basicAuth:
    secret: authsecret

---

# Example:
#   htpasswd -nb venkat hello | base64
#   dmVua2F0OiRhcHIxJE52L0lPTDZlJDRqdFlwckpjUk1aWU5aeG45M0xCNi8KCg==

apiVersion: v1
kind: Secret
metadata:
  name: authsecret
data:
  users: |
    dmVua2F0OiRhcHIxJC5sS2MvYVhkJEVXVjBUcFMwYnJySmFCL1hBbW90eDA=

---

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nginx
  namespace: default
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`nginx.mahinraza.online`)
      kind: Rule
      middlewares:
        - name: nginx-basic-auth 
      services:
        - name: nginx-svc-blue
          port: 80
  tls:
    secretName: wildcard-mahinraza-online