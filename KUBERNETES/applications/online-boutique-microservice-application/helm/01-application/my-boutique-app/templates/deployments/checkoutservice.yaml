{{- if .Values.checkoutservice.enabled -}}
{{- $name := "checkoutservice" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "01-application.fullname" . }}-{{ $name }}
  labels:
    {{- include "01-application.metadataLabels" . | nindent 4 }}
    {{- include "01-application.selectorLabels" (list . $name) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "01-application.selectorLabels" (list . $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "01-application.metadataLabels" . | nindent 8 }}
        {{- include "01-application.selectorLabels" (list . $name) | nindent 8 }}
    spec:
      {{- $svc := index .Values $name }}
      {{- if not $svc.autoscaling.enabled }}
      replicas: {{ $svc.replicaCount }}
      {{- end }}
      serviceAccountName: {{ include "01-application.fullname" . }}-{{ $name }}
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          image: mahinraza556/checkoutservice
          ports:
          - containerPort: 5050
          readinessProbe:
            grpc:
              port: 5050
          livenessProbe:
            grpc:
              port: 5050
          env:
          - name: PORT
            value: "5050"
          - name: PRODUCT_CATALOG_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: PRODUCT_CATALOG_SERVICE_ADDR
          - name: SHIPPING_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: SHIPPING_SERVICE_ADDR
          - name: PAYMENT_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: PAYMENT_SERVICE_ADDR
          - name: EMAIL_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: EMAIL_SERVICE_ADDR
          - name: CURRENCY_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: CURRENCY_SERVICE_ADDR
          - name: CART_SERVICE_ADDR
            valueFrom:
              configMapKeyRef:
                name: "{{ include "01-application.configmapName" . }}"
                key: CART_SERVICE_ADDR
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
{{- end -}}