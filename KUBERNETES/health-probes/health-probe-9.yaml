apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: payment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      terminationGracePeriodSeconds: 60
      containers:
      - name: payment-api
        image: python:slim
        command:
        - python
        - /app/app.py
        ports:
        - containerPort: 8080 
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          failureThreshold: 6
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          initialDelaySeconds: 5
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 5
          failureThreshold: 3
          periodSeconds: 5
          successThreshold: 1
        lifecycle:
          preStop:
            httpGet:
              path: /shutdown
              port: http
              scheme: HTTP
        volumeMounts:
        - name: app-code
          mountPath: /app
          readOnly: true
      volumes:
      - name: app-code
        configMap:
          name: payment-api-code