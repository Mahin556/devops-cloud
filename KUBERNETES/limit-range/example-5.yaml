apiVersion: v1
kind: LimitRange
metadata:
  name: namespace-limits
  namespace: dev
spec:
  limits:
    # Individual container resources
    - type: Container
      min:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "2Gi"
      default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "250m"
        memory: "256Mi"

    # Total resources of a Pod
    - type: Pod
      max:
        cpu: "4"
        memory: "4Gi"

    # PVC storage
    - type: PersistentVolumeClaim
      min:
        storage: "1Gi"
      max:
        storage: "10Gi"