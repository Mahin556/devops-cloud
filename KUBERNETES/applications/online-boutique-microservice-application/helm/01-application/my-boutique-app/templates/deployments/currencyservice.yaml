{{- if .Values.currencyservice.enabled -}}
{{- $name := "currencyservice" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "01-application.fullname" . }}-{{ $name }}
  labels:
    {{- include "01-application.metadataLabels" . | nindent 4 }}
    {{- include "01-application.selectorLabels" (list . $name) | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "01-application.selectorLabels" (list . $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "01-application.metadataLabels" . | nindent 8 }}
        {{- include "01-application.selectorLabels" (list . $name) | nindent 8 }}
    spec:
      {{- $svc := index .Values $name }}
      {{- if not $svc.autoscaling.enabled }}
      replicas: {{ $svc.replicaCount }}
      {{- end }}
      serviceAccountName: {{ include "01-application.fullname" . }}-{{ $name }}
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: mahinraza556/currencyservice
        ports:
        - name: grpc
          containerPort: 7000
        env:
        - name: PORT
          value: "7000"
        - name: DISABLE_PROFILER
          value: "1"
        readinessProbe:
          grpc:
            port: 7000
        livenessProbe:
          grpc:
            port: 7000
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
{{- end -}}